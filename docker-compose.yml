services:
  web:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: adoptpet-web

    ports:
      - "3000:3000"

    environment:
      NODE_ENV: production
      MONGODB_URI: ${MONGODB_URI}
      AUTH_SECRET: ${AUTH_SECRET}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ML_SERVICE_URL: http://ml-service:8000

    depends_on:
      - ml-service

  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile

    container_name: adoptpet-ml-service

    ports:
      - "8000:8000"

    environment:
      MODEL_DIR: /app/models

    volumes:
      - ./ml-service/models:/app/models